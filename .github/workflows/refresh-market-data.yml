name: Refresh Shivshakti Market Data

on:
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "scripts/refresh_market_data.py"
      - ".github/workflows/refresh-market-data.yml"
  schedule:
    # NSE session in IST is approximately 09:15-15:30 (UTC 03:45-10:00).
    # GitHub cron is UTC; scheduled starts may be delayed.
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30,45 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-refresh-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh OHLCV files
        run: python scripts/refresh_market_data.py

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- candles.csv.gz data/ status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            # Do not rebase a generated data commit: concurrent refreshes both
            # create/update large CSVs and add/add conflicts can strand rebase.
            # Instead, preserve the newly generated CSVs in the worktree, reset
            # the index to the newest main, then commit only the data outputs.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git reset origin/main
              git add -A -- candles.csv.gz data/ status.json
              if git diff --cached --quiet; then
                echo "No data changes to commit."
                exit 0
              fi
              git commit -m "chore(data): refresh OHLCV market data"
              if git push origin HEAD:main; then
                echo "CSV updates pushed successfully."
                exit 0
              fi
              echo "Push attempt $attempt failed because main advanced; rebuilding data commit on latest main."
              sleep 2
            done
            echo "Could not push CSV updates after 5 attempts." >&2
            exit 1
          fi
