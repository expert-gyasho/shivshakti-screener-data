name: Refresh Shivshakti Market Data

on:
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "scripts/refresh_market_data.py"
      - ".github/workflows/refresh-market-data.yml"
  schedule:
    # NSE session in IST is approximately 09:15-15:30 (UTC 03:45-10:00).
    # GitHub cron is UTC; scheduled starts may be delayed.
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30,45 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh OHLCV files
        run: python scripts/refresh_market_data.py

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candles.csv data/ status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh OHLCV market data"
            # A concurrent workflow or web edit may advance main after checkout.
            # Rebase on the newest main and retry push to avoid losing a data run.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "CSV updates pushed successfully."
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after refreshing main."
              sleep 2
            done
            echo "Could not push CSV updates after 3 attempts." >&2
            exit 1
          fi
